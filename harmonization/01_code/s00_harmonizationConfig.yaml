# AGEVAL Configuration
# Edit these values for each new project

project:
  name: "Coffee IE Honduras"
  organization: "CIAT"
  country: "Honduras"
  language: "spanish"          # "spanish" or "english" — controls ODK labels
  form_id: "ageval_coffee_hn"
  form_version: "2026010101"
  baseline_round: "baseline"
  endline_round: "endline"

paths:
  base: "../.."
  dictionary_master: "dictionary/variables_master.xlsx"
  dictionary_baseline: "baseline/02_dictionary/variables_personalized.csv"
  dictionary_endline: "endline/02_dictionary/variables_personalized.csv"
  dictionary_harmonization: "harmonization/02_dictionary/variables_personalized.csv"
  data_baseline: "baseline/04_data/dataClean/"
  data_endline: "endline/04_data/dataClean/"
  data_harmonization: "harmonization/03_data/"
  treatment_assignment: "harmonization/04_treatmentAssignment/treatment_assignment.xlsx"
  outputs_quality: "harmonization/05_qualityCheck/"
  outputs_plots: "harmonization/06_plots/"
  outputs_regressions: "harmonization/07_regressions/"

harmonize:
  id_variable: "respondent_id"   # participant/survey ID column, kept unchanged when building the long database
  period_variable: "period"      # name of the new round indicator column
  baseline_period_value: 0
  endline_period_value: 1
  long_data_filename: "data_long.csv"
  treatment_var: "treatment"            # name of the treatment assignment column (numeric, for regressions)
  treatment_label: "treatment_label"    # name of the treatment assignment label column
  long_treatment_filename: "data_long_treatment.csv"   # long database + treatment, saved in data_harmonization

model:
  default_estimator: "OLS"     # "OLS", "FE", "IV"
  cluster_var: "enumerator_id"
  output_format: "both"        # "latex", "csv", or "both"